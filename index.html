<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' wss://wss.vdo.ninja https://turnservers.vdo.ninja; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="theme-color" content="#f3f2ec">
  <title>Immersive Video Player</title>
  <script src="./vendor/vdoninja/1.5.5/vdoninja-sdk.min.js" defer></script>
</head>
<body class="landing">
  <main id="entry" class="entry stretch-shell" data-layout="bounded">
    <header class="shell-header"><h1>Immersive Video Player</h1><p id="entry-status" class="status" role="status" aria-live="polite"></p></header>
    <section id="entry-invitation" class="entry-body stretch-body">
      <div class="qr-space"><canvas id="entry-qr" role="img" aria-label="Session QR"></canvas></div>
      <details id="entry-options"><summary>Session</summary><div class="utility-content">
        <input id="entry-link" aria-label="Session link" readonly autocomplete="off" spellcheck="false">
        <div class="actions"><button id="copy-session">Copy link</button><button id="copy-headset">Copy viewer</button></div>
      </div></details>
    </section>
    <footer class="shell-footer"><a id="open-viewer" class="button-link primary fixed-action">Viewer</a><a id="open-controller" class="button-link fixed-action">Controller</a><button id="new-session" class="fixed-action">New</button></footer>
  </main>
  <main id="player" class="app" hidden>
    <section class="screen" aria-label="Video">
      <div id="stage" tabindex="0" aria-label="Video panorama"></div>
      <video id="video" playsinline preload="none" data-src="./media/jona.mp4" aria-hidden="true"></video>
      <div class="screen-caption"><span id="role-label">Viewer</span><span id="screen-time">00:00 / 07:47</span></div>
      <button id="show-controls" class="screen-toggle" hidden>Controls</button>
    </section>
    <aside id="panel" class="panel stretch-shell" data-layout="bounded" aria-label="Controls">
      <header class="shell-header"><h1>Immersive Video Player</h1><p id="connection" class="status" role="status" aria-live="polite">Offline</p><p id="notice" class="status" role="status" aria-live="polite"></p></header>
      <div class="panel-body stretch-body">
        <details id="connection-settings" name="controls" data-accordion open><summary>Connection</summary><div class="accordion-content">
          <div class="actions"><button id="arm" class="primary fixed-action">Enable</button><button id="connect" class="fixed-action">Connect</button><button id="enter-vr" class="fixed-action">VR</button><button id="stop" class="fixed-action" hidden>Disconnect</button><button id="show-qr" hidden>QR</button></div>
          <div id="paste-invitation" hidden><input id="pasted-link" aria-label="Session link" type="url" placeholder="Session link" autocomplete="off" spellcheck="false"><button id="use-link">Join</button></div>
        </div></details>
        <fieldset id="controls" aria-label="Playback controls" disabled>
          <details id="playback-settings" name="controls" data-accordion><summary>Playback</summary><div class="accordion-content">
            <div class="transport"><button id="play" class="primary">Play</button><button id="pause">Pause</button></div>
            <label class="range-row" for="seek"><span>Time</span><input id="seek" type="range" min="0" max="467.3" step="0.1" value="0"><output id="position">00:00</output></label>
            <label class="range-row" for="volume"><span>Volume</span><input id="volume" type="range" min="0" max="1" step="0.05" value="1"><output id="volume-value">100%</output></label>
            <button id="recenter">Recenter</button>
          </div></details>
          <details id="view-settings" name="controls" data-accordion><summary>View</summary><div class="accordion-content">
            <label class="select-row" for="projection"><span>Mode</span><select id="projection"><option value="fisheye">Fisheye</option><option value="equirect360">360°</option><option value="equirect180">180°</option><option value="flat">Flat</option></select></label>
            <label class="range-row" for="lens"><span>Lens</span><input id="lens" type="range" min="180" max="360" step="5" value="270"><output id="lens-value">270°</output></label>
            <label class="range-row" for="fov"><span>FOV</span><input id="fov" type="range" min="45" max="110" step="5" value="80"><output id="fov-value">80°</output></label>
            <label class="range-row" for="yaw"><span>Yaw</span><input id="yaw" type="range" min="-180" max="180" step="5" value="0"><output id="yaw-value">0°</output></label>
            <label class="range-row" for="pitch"><span>Pitch</span><input id="pitch" type="range" min="-90" max="90" step="5" value="0"><output id="pitch-value">0°</output></label>
          </div></details>
        </fieldset>
      </div>
      <footer class="shell-footer"><a id="switch-mode" class="button-link fixed-action" hidden></a><a class="button-link fixed-action" href="./">New</a><button id="hide-controls" class="fixed-action">Hide</button></footer>
    </aside>
  </main>
  <dialog id="qr-dialog" aria-label="Session QR"><form method="dialog"><button>Close</button></form><div id="invitation" hidden><canvas id="qr" role="img" aria-label="Session QR"></canvas><input id="invite-link" aria-label="Controller link" readonly autocomplete="off" spellcheck="false"><button id="copy-link">Copy</button></div></dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
